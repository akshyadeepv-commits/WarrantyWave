# =====================================================================
# Local In-Memory Development & Demo Profile
# Activated when SPRING_PROFILES_ACTIVE=dev (Default)
# Provides instant out-of-the-box runnability with zero setup
# =====================================================================

spring.datasource.url=jdbc:h2:mem:warrantywave;DB_CLOSE_DELAY=-1;MODE=Oracle;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Enable H2 web console for inspecting data locally
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

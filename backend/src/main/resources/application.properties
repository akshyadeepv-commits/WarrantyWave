# =====================================================================
# WarrantyWave Application Configuration
# =====================================================================

spring.application.name=warranty-wave-backend
server.port=8080

# Active Profile: change to 'oracle' to connect to Oracle Database
# Can also be passed via JVM flag: -Dspring.profiles.active=oracle
# or environment variable: SPRING_PROFILES_ACTIVE=oracle
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JPA Common Settings
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Security & JWT Configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Configuration for Angular frontend
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}

# OpenAPI / Swagger Documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

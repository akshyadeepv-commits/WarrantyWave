# =====================================================================
# Oracle Database Profile Configuration
# Activated when SPRING_PROFILES_ACTIVE=oracle
# =====================================================================

spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
spring.datasource.username=${DB_USERNAME:WARRANTYWAVE}
spring.datasource.password=${DB_PASSWORD:SecureAppPass2026!}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Connection Pooling (HikariCP)
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# Hibernate JPA Settings for Oracle
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
